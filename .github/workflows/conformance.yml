name: Micropub conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run conformance:setup
      - run: bun test scripts/conformance/harness.test.mjs
      - run: bun run conformance
      - name: Preserve conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: micropub-conformance
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .conformance/latest.json
            .conformance/runs/*/summary.json
            .conformance/runs/*/app.log
            .conformance/runs/*/*/result.json
            .conformance/runs/*/*/result.html
            .conformance/runs/*/*/posts/**
