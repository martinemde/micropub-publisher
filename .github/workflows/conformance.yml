name: Micropub conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:cloudflare
      - run: pnpm run conformance:setup
      - run: pnpm run test:conformance
      - run: pnpm run conformance
      - name: Preserve conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: micropub-conformance
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .conformance/latest.json
            .conformance/runs/*/summary.json
            .conformance/runs/*/app.log
            .conformance/runs/*/*/result.json
            .conformance/runs/*/*/result.html
            .conformance/runs/*/*/posts/**
